name: Backend Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Backend Tests and Generate Coverage
        run: |
          mkdir -p frontend/dist
          echo dummy > frontend/dist/index.html
          
          echo "Listing all .go files in the repository:"
          find . -name "*.go"
          
          echo "Running Go tests and generating coverage profile..."
          go test -v -coverprofile=coverage.out -- ./...
          
          echo "Listing files in current directory after go test:"
          ls -R
          
          # Install gocov and gocov-xml
          go install github.com/AlekSi/gocov@latest # Install gocov
          go install github.com/AlekSi/gocov-xml@latest
          
          coverageFile="coverage.out"
          if [ -f "$coverageFile" ]; then
              if [ -s "$coverageFile" ]; then
                  echo "$coverageFile created successfully and is not empty. Converting to JSON then XML..."
                  # Convert coverage.out to JSON first
                  gocov convert "$coverageFile" > coverage.json
                  # Then convert JSON to XML
                  cat coverage.json | gocov-xml > coverage.xml
              else
                  echo "WARNING: $coverageFile was created but is empty. Skipping gocov-xml conversion."
              fi
          else
              echo "ERROR: $coverageFile was NOT created by 'go test'. Cannot generate Go coverage XML."
              exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml