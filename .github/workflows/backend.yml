name: Backend Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest # Changed to ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Backend Tests and Generate Coverage
        run: |
          mkdir -p frontend/dist # Linux equivalent
          echo dummy > frontend/dist/index.html # Linux equivalent
          
          echo "Listing all .go files in the repository:"
          find . -name "*.go" # Linux equivalent
          
          echo "Running Go tests and generating coverage profile..."
          go test -v -coverprofile=coverage.out -- ./... # This should now work correctly
          
          echo "Listing files in current directory after go test:"
          ls -R # Linux equivalent for recursive listing
          
          go install github.com/AlekSi/gocov-xml@latest
          
          coverageFile="coverage.out"
          if [ -f "$coverageFile" ]; then # Check if file exists
              if [ -s "$coverageFile" ]; then # Check if file is not empty
                  echo "$coverageFile created successfully and is not empty. Converting to XML..."
                  cat "$coverageFile" | gocov-xml > coverage.xml # Linux equivalent
              else
                  echo "WARNING: $coverageFile was created but is empty. Skipping gocov-xml conversion."
              fi
          else
              echo "ERROR: $coverageFile was NOT created by 'go test'. Cannot generate Go coverage XML."
              exit 1 # Exit with error code
          fi
        # Removed shell: cmd as bash is default for ubuntu-latest

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml