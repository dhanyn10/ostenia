name: Backend Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Backend Tests and Generate Coverage
        run: |
          if not exist frontend\dist mkdir frontend\dist
          echo dummy > frontend\dist\index.html
          
          echo Listing all .go files in the repository:
          dir /s /b *.go
          
          echo Running Go tests and generating coverage profile...
          go test -v -coverprofile=coverage.out -- ./...
          
          echo Listing files in current directory after go test:
          dir /s
          
          go install github.com/AlekSi/gocov-xml@latest
          
          set "coverageFile=coverage.out"
          if exist "%coverageFile%" (
              for %%F in ("%coverageFile%") do set "fileSize=%%~zF"
              if %fileSize% gtr 0 (
                  echo %coverageFile% created successfully and is not empty. Converting to XML...
                  type "%coverageFile%" | gocov-xml > coverage.xml
              ) else (
                  echo WARNING: %coverageFile% was created but is empty. Skipping gocov-xml conversion.
              )
          ) else (
              echo ERROR: %coverageFile% was NOT created by 'go test'. Cannot generate Go coverage XML.
              exit /b 1
          )
        shell: cmd

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml