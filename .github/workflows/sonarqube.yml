name: SonarQube Analysis
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\go\bin\wails.exe
          key: ${{ runner.os }}-wails-2.12.0

      - name: Install Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@ebe9d32e170905ff726a3bbb3d0076282e4edc41
        shell: pwsh

      - name: Run Backend Tests
        run: |
          New-Item -Path "frontend/dist" -ItemType Directory -Force
          "dummy" | Out-File -FilePath "frontend/dist/index.html"
          go test -v -coverprofile coverage-backend.out ./...
        shell: pwsh

      - name: Run Frontend Tests
        run: |
          $env:PATH += ";C:\Users\runneradmin\go\bin"
          wails generate module
          cd frontend
          pnpm install --no-frozen-lockfile
          pnpm vitest run --coverage.enabled --coverage.reporter=lcov --coverage.reportsDirectory=./coverage
        shell: pwsh

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
