name: SonarQube Analysis
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      # - name: Run Backend Tests
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      #     mkdir -p frontend/dist
      #     echo "dummy" > frontend/dist/index.html
      #     go test ./... -v -coverprofile=coverage-backend.out -json > report-backend.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # - name: Run Frontend Tests
      #   working-directory: frontend
      #   run: |
      #     corepack enable pnpm
      #     pnpm install
      #     npx vitest run --coverage --coverage.reporter=lcov --coverage.reportsDirectory=./coverage
      #     mkdir -p ../coverage
      #     cp coverage/lcov.info ../coverage/lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}