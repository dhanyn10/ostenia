name: Playwright E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend; pnpm install --no-frozen-lockfile
        shell: pwsh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\go\bin\wails.exe
          key: ${{ runner.os }}-wails-2.12.0

      - name: Install Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@ebe9d32e170905ff726a3bbb3d0076282e4edc41
        shell: pwsh

      - name: Generate Wails Bindings
        run: |
          $env:PATH += ";C:\Users\runneradmin\go\bin"
          wails generate module
        shell: pwsh

      - name: Get Playwright version
        id: playwright-version
        run: |
          $ver = node -e "console.log(require('./frontend/package.json').devDependencies['@playwright/test'])"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        shell: pwsh

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd frontend; pnpm playwright install chromium
        shell: pwsh

      - name: Run Playwright tests
        run: cd frontend; pnpm playwright test
        shell: pwsh
